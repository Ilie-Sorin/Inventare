{% extends "base.html" %}
{% block titlu %}Persoane{% endblock %}
{% block continut %}
<div class="d-flex justify-content-between align-items-center mb-3">
  <h1 class="h4 mb-0">Persoane / gestiuni</h1>
  <div>
    <a class="btn btn-outline-secondary btn-sm" href="{{ url_for('persoane.email_pagina') }}">E-mailuri (Excel)</a>
    {% if poate('OPERATOR') %}
    <a class="btn btn-primary btn-sm" href="{{ url_for('persoane.nou') }}">Adaugă persoană</a>
    {% endif %}
  </div>
</div>
<form class="row g-2 mb-3" method="get" hx-get="{{ url_for('persoane.lista') }}" hx-target="#tabel"
      hx-trigger="input changed delay:300ms from:input, change from:select" hx-push-url="true">
  <div class="col-md-4">
    <input type="search" name="q" value="{{ q }}" class="form-control" placeholder="Caută după nume…" aria-label="Caută">
  </div>
  <div class="col-md-2">
    <select name="stare" class="form-select" aria-label="Stare">
      {% for v, t in [("active", "Active"), ("inactive", "Inactive"), ("toate", "Toate")] %}
      <option value="{{ v }}" {{ "selected" if stare == v }}>{{ t }}</option>
      {% endfor %}
    </select>
  </div>
  <div class="col-md-3">
    <select name="locatie_id" class="form-select" aria-label="Locație">
      <option value="">Toate locațiile</option>
      {% for id, den in locatii %}<option value="{{ id }}" {{ "selected" if locatie_id == id }}>{{ den }}</option>{% endfor %}
    </select>
  </div>
  <div class="col-md-3">
    <select name="activitate_id" class="form-select" aria-label="Activitate">
      <option value="">Toate activitățile</option>
      {% for id, den in activitati %}<option value="{{ id }}" {{ "selected" if activitate_id == id }}>{{ den }}</option>{% endfor %}
    </select>
  </div>
  <noscript><div class="col-12"><button class="btn btn-secondary btn-sm">Filtrează</button></div></noscript>
</form>
<div id="tabel">{% include "persoane/_tabel.html" %}</div>
{% endblock %}
